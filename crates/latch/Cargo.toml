[package]
name = "latch"
version = "0.1.10"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "2"
tempfile = "3"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "time"] }
globset = "0.4"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
